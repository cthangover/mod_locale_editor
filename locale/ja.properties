# 翻訳ウィンドウ（locale_editor）：テキストは言語ごとのファイルに入ります。
tools/locale_editor/title = 翻訳
tools/locale_editor/rescan = 再スキャン
tools/locale_editor/rescan_tip = すべての MOD のローカライズファイルを読み直します
tools/locale_editor/language_tip = 不足しているテキストを表示する言語
tools/locale_editor/mod_tip = 1 つの MOD のテキストだけを表示
tools/locale_editor/all_mods = すべての MOD
tools/locale_editor/search = キーまたは MOD で検索
tools/locale_editor/count = {1} で {0} 件不足
tools/locale_editor/scanning = ローカライズファイルを読んでいます...
tools/locale_editor/scanned = 不足しているテキストが {0} 件あります。行を選んで翻訳してください。
tools/locale_editor/scan_failed = スキャンに失敗しました。ログの LOCALE_EDITOR を確認してください。
tools/locale_editor/hint = 言語と行を選び、翻訳を入力して「保存」を押してください。テキストは所属する MOD のローカライズファイルに書き込まれます。
tools/locale_editor/gap_section = 不足しているテキスト
tools/locale_editor/key = キー
tools/locale_editor/mod = MOD
tools/locale_editor/file = ファイル
tools/locale_editor/source = 他の言語のテキスト
tools/locale_editor/translation = 翻訳
tools/locale_editor/text_placeholder = ここに翻訳を入力
tools/locale_editor/read_only = この MOD は読み取り専用（zip パッケージ）のため、ここでは保存できません。
tools/locale_editor/save = 保存
tools/locale_editor/save_tip = 翻訳を保存 (Ctrl+S)
tools/locale_editor/pick_row = 先に左の行を選んでください。
tools/locale_editor/no_source = 他の言語のテキストはまだありません。
tools/locale_editor/empty = 先に翻訳を入力してください。
tools/locale_editor/saved = {0} を {1} に保存しました。ゲームにすぐ新しいテキストが表示されます。
mod_locale_editor_name = 翻訳
mod_locale_editor_desc = 翻訳ウィンドウ：言語に不足しているテキストをすべて表示し、MOD のローカライズファイルに保存します。
