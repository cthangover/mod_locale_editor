# 翻译窗口（locale_editor）：每种语言的文本各自保存在自己的文件中。
tools/locale_editor/title = 翻译
tools/locale_editor/rescan = 重新检查
tools/locale_editor/rescan_tip = 重新读取所有模组的本地化文件
tools/locale_editor/language_tip = 列出缺失文本的语言
tools/locale_editor/mod_tip = 只显示一个模组的文本
tools/locale_editor/all_mods = 所有模组
tools/locale_editor/search = 按键或模组搜索
tools/locale_editor/count = 缺少 {0} 条 · 语言 {1}
tools/locale_editor/scanning = 正在读取本地化文件...
tools/locale_editor/scanned = 缺少 {0} 条文本。选择一行进行翻译。
tools/locale_editor/scan_failed = 检查失败。请在日志中查看 LOCALE_EDITOR。
tools/locale_editor/hint = 选择语言和一行，输入翻译后点击“保存”。文本会写入其所属模组的本地化文件。
tools/locale_editor/gap_section = 缺失的文本
tools/locale_editor/key = 键
tools/locale_editor/mod = 模组
tools/locale_editor/file = 文件
tools/locale_editor/source = 其他语言的文本
tools/locale_editor/translation = 翻译
tools/locale_editor/text_placeholder = 在此输入翻译
tools/locale_editor/read_only = 此模组为只读（zip 包），无法在此保存文本。
tools/locale_editor/save = 保存
tools/locale_editor/save_tip = 保存翻译 (Ctrl+S)
tools/locale_editor/pick_row = 请先在左侧选择一行。
tools/locale_editor/no_source = 还没有其他语言的文本。
tools/locale_editor/empty = 请先输入翻译。
tools/locale_editor/saved = 已保存 {0}，写入 {1}。游戏现在已显示新文本。
mod_locale_editor_name = 翻译
mod_locale_editor_desc = 翻译窗口：列出某种语言缺少的所有文本，输入后保存到模组的本地化文件中。
