# 번역 창(locale_editor): 모든 텍스트는 언어별 파일에 따로 들어갑니다.
tools/locale_editor/title = 번역
tools/locale_editor/rescan = 다시 검사
tools/locale_editor/rescan_tip = 모든 모드의 현지화 파일을 다시 읽습니다
tools/locale_editor/language_tip = 누락된 텍스트를 보여 줄 언어
tools/locale_editor/mod_tip = 모드 하나의 텍스트만 보기
tools/locale_editor/all_mods = 모든 모드
tools/locale_editor/search = 키 또는 모드로 검색
tools/locale_editor/count = {1}: 누락 {0}개
tools/locale_editor/scanning = 현지화 파일을 읽는 중...
tools/locale_editor/scanned = 누락된 텍스트 {0}개를 찾았습니다. 행을 골라 번역하세요.
tools/locale_editor/scan_failed = 검사에 실패했습니다. 로그에서 LOCALE_EDITOR를 확인하세요.
tools/locale_editor/hint = 언어와 행을 고르고 번역을 입력한 뒤 저장을 누르세요. 텍스트는 해당 모드의 현지화 파일에 들어갑니다.
tools/locale_editor/gap_section = 누락된 텍스트
tools/locale_editor/key = 키
tools/locale_editor/mod = 모드
tools/locale_editor/file = 파일
tools/locale_editor/source = 다른 언어의 텍스트
tools/locale_editor/translation = 번역
tools/locale_editor/text_placeholder = 여기에 번역을 입력
tools/locale_editor/read_only = 이 모드는 읽기 전용(zip 패키지)이라 여기서 저장할 수 없습니다.
tools/locale_editor/save = 저장
tools/locale_editor/save_tip = 번역 저장 (Ctrl+S)
tools/locale_editor/pick_row = 먼저 왼쪽에서 행을 고르세요.
tools/locale_editor/no_source = 다른 언어의 텍스트가 아직 없습니다.
tools/locale_editor/empty = 먼저 번역을 입력하세요.
tools/locale_editor/saved = {0}을(를) {1}에 저장했습니다. 게임이 새 텍스트를 바로 보여 줍니다.
mod_locale_editor_name = 번역
mod_locale_editor_desc = 번역 창: 언어에 없는 모든 텍스트를 보여 주고, 입력하면 모드의 현지화 파일에 저장합니다.
